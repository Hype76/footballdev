build:
  name: Coach internal Android with reviewed dependencies
  steps:
    - eas/checkout
    - run:
        name: Verify reviewed source and install secured dependencies
        command: |
          set -eu
          node ../../scripts/security-eas-coach-test.mjs preflight
          node ../scripts/mobile-eas-toolchain.mjs
          cd ../..
          npm ci --ignore-scripts --no-audit --no-fund
          cd apps/coach-mobile
          node ../../scripts/security-eas-coach-test.mjs provision
    - eas/resolve_build_config
    - run: node ../../scripts/security-eas-coach-test.mjs verify
    - run: EXPO_IMAGE_UTILS_NO_SHARP=1 node ./node_modules/expo/bin/cli prebuild --no-install --platform android
    - run: node ../../scripts/security-eas-coach-test.mjs verify
    - eas/configure_eas_update
    - eas/inject_android_credentials
    - eas/configure_android_version
    - run: node ../../scripts/security-eas-coach-test.mjs capture
    - eas/run_gradle
    - run: node ../../scripts/security-eas-coach-test.mjs finalize
    - eas/find_and_upload_build_artifacts
