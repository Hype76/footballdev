name: Parent notification explainer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parent-notification-explainer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notification-explainer:
    name: Parent notification explainer regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
      - run: npm install --global npm@11.7.0
      - run: npm ci --include=optional
      - run: npm ci --prefix apps/parent-mobile --include=optional
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/parent-notification-native-setup.test.mjs tests/parent-notification-explainer.test.mjs tests/mobile-notification-status-bell-127.test.mjs tests/mobile-notification-mode-choice-108.test.mjs tests/mobile-parent-notifications-21b.test.mjs tests/mobile-notification-categories.test.mjs tests/fan-app-link.test.mjs tests/parent-chat-notification-deep-link-36e.test.mjs
      - run: node tests/parent-notification-explainer-browser.mjs
