name: Contact request contract

on:
  pull_request:
    paths:
      - 'netlify/functions/send-contact-request.js'
      - 'netlify/functions/lib/_email-provider.js'
      - 'tests/contact-request.test.mjs'
      - '.github/workflows/contact-request.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
          cache: npm
      - run: npm install --global npm@11.7.0
      - run: npm ci --include=optional
      - run: node --test tests/contact-request.test.mjs tests/system-support-email-gating.test.mjs tests/email-provider.test.mjs tests/email-send-route-coverage.test.mjs tests/netlify-functions-packaging.test.mjs
      - run: npx --no-install eslint netlify/functions/send-contact-request.js
